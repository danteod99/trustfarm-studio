# Construye la imagen de RunPod (worker-comfyui + ComfyUI 0.43 + nuestro worker) y la sube a GHCR.
name: Imagen RunPod

on:
  push:
    branches: [main]
    paths: ["worker/**", "runpod/**", ".github/workflows/runpod-image.yml"]
  workflow_dispatch:

env:
  WORKER_COMFYUI: "5.11.0"
  COMFYUI_VERSION: "0.43.0"
  IMAGE: ghcr.io/${{ github.repository_owner }}/trustfarm-comfy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Liberar disco (la imagen pesa ~15 GB)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - uses: actions/checkout@v4

      - name: Bajar worker-comfyui ${{ env.WORKER_COMFYUI }}
        run: git clone --depth 1 --branch "$WORKER_COMFYUI" https://github.com/runpod-workers/worker-comfyui.git /tmp/worker-comfyui

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Base (ComfyUI ${{ env.COMFYUI_VERSION }})
        run: |
          docker build /tmp/worker-comfyui --target base \
            --build-arg COMFYUI_VERSION="$COMFYUI_VERSION" \
            -t trustfarm-comfy-base

      - name: Imagen final
        run: |
          docker build . -f runpod/Dockerfile --build-arg BASE=trustfarm-comfy-base \
            -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}"
          docker push --all-tags "$IMAGE"
