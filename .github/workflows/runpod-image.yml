# Construye la imagen de RunPod (runpod/Dockerfile) y la sube a GHCR.
name: Imagen RunPod

on:
  push:
    branches: [main]
    paths: ["worker/**", "runpod/**", ".github/workflows/runpod-image.yml"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trustfarm-comfy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Liberar disco (la imagen pesa ~15 GB)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir
        run: |
          docker build . -f runpod/Dockerfile -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}"
          docker push --all-tags "$IMAGE"
